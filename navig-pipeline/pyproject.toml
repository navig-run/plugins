[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navig-pipeline"
version = "0.7.0"
description = "The content assembly line: short vertical clips cut to the beat, narrated reels, captions and hooks, and download → transcribe → script → narrate → fan-out — its own navig-pipeline command, with your own keys; also `navig pipeline` inside navig."
readme = "README.md"
authors = [{ name = "NAVIG Development Team", email = "opensource@navig.run" }]
keywords = ["navig", "cli", "agent", "automation", "plugin", "pipeline", "workflow", "orchestration"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
requires-python = ">=3.10"
license = "Apache-2.0"
# Runs WITHOUT navig. The shared media engine (ffmpeg audio/video edits, frames, fx) comes
# from navig-media-core, beats / video generation from navig-generate, and the voice
# (scenarios, narration, word-timed transcription for captions) from navig-audio; all run on
# their own. The fan-out stages (navig-text / -social / -download) are optional and
# soft-imported — a missing one drops its stage — so they are the `all` extra. Filming a
# live URL drives a browser through navig-browser (the `film` extra); only `schedule`
# (navig's daemon cron) needs navig.
dependencies = [
  "navig-sdk>=2.16.0",
  "navig-generate>=0.2.1",
  "navig-media-core>=0.2.0",
  "navig-audio>=0.3.0",
  "numpy>=1.24",
  "typer>=0.14.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
# Every stage of `run`, all of which run on their own: script (navig-text), acquire
# (navig-download) and publish (navig-social).
all = ["navig-text>=0.4.0", "navig-download>=0.2.0", "navig-social>=0.2.0", "navig-browser[drive]>=0.1.0"]
# Filming a live URL in a clip or reel drives a real browser through navig-browser.
film = ["navig-browser[drive]>=0.1.0"]
# `pipeline cast` records real output through a pseudo-terminal so colour survives. POSIX
# uses the stdlib pty; Windows needs ConPTY via pywinpty (without it: a pipe, and Rich
# on Windows colours through Win32 calls a pipe never sees — the capture comes out grey).
cast = ["pywinpty>=2.0.13; sys_platform == 'win32'"]

# Its own command: the same commands navig mounts on `navig pipeline`.
[project.scripts]
navig-pipeline = "navig_pipeline.cli:main"
navig-content = "navig_pipeline.cli:main_content"

# Discovered by navig.core.plugins.load_entry_point_plugins() at gateway boot.
[project.entry-points."navig.plugins"]
pipeline = "navig_pipeline.plugin"

# `navig content` (content production: run / status / episode / reel …). Discovered by
# navig.cli.registration._entry_point_commands() — no hardcoded map entry needed.
# `pipeline` is the same app under its old name: a deprecated alias (hidden, warns on stderr).
[project.entry-points."navig.commands"]
content = "navig_pipeline.commands.pipeline:pipeline_app"
pipeline = "navig_pipeline.commands.pipeline:pipeline_app"

[tool.setuptools.packages.find]
include = ["navig_pipeline*"]

[project.urls]
Homepage = "https://navig.run"
Documentation = "https://navig.run/docs"

[tool.navig]
# Runs on its own (`navig-pipeline`, no navig needed) AND as `navig pipeline` inside navig.
# Checked against the package by scripts/check_plugins_publishable.py.
mode = "standalone"

# The Reel Stage player ships inside the package (navig_pipeline/stage_assets).
[tool.setuptools.package-data]
navig_pipeline = ["stage_assets/*"]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navig-mini"
version = "1.1.3"
description = "NAVIG Mini — Lightweight AI agent daemon for Raspberry Pi, NAS boxes, and low-power devices"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "NAVIG Team", email = "opensource@navig.run" }]
keywords = ["agent", "raspberry-pi", "nas", "iot", "telegram", "monitoring", "daemon"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.6",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Systems Administration",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

# ── ZERO mandatory dependencies ───────────────────────────────────────────────
# Everything in agent.py and monitor.py is pure stdlib.
# psutil is optional — enables richer CPU metrics.
dependencies = []

[project.optional-dependencies]
rich = ["psutil>=5.9.0"]    # optional richer stats
dev  = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
navig-mini = "navig_mini.cli:main"

[project.urls]
Homepage = "https://navig.run"
Documentation = "https://navig.run/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["navig_mini*"]

[tool.setuptools.package-data]
navig_mini = ["*.py"]

[tool.ruff]
target-version = "py39"
line-length = 100

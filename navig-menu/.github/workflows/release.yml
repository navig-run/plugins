name: release

# Runs ONLY on a version tag (e.g. v1.0.0) — never on normal pushes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

      # Standalone single-file binaries (advertised in the README). Tag-only, so the
      # extra minutes here don't touch the fast per-push `ci` workflow.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Compile binaries
        run: bun run scripts/build-binaries.ts
      - name: Checksums
        run: (cd out && sha256sum menu-* > SHA256SUMS)

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/menu-*
            out/SHA256SUMS

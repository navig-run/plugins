[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navig-generate"
version = "0.1.2"
description = "NAVIG Generate module — AI media generation (image/video/audio) deck surface. A first-party navig plugin (free, toggleable). Renamed from navig-media; the 'media' name is deprecated."
readme = "README.md"
authors = [{ name = "NAVIG Development Team", email = "opensource@navig.run" }]
keywords = ["navig", "cli", "agent", "automation", "plugin", "ai", "image", "generation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
requires-python = ">=3.10"
license = "Apache-2.0"
# Declares navig: this plugin's code imports navig.* directly, so a bare
# `pip install navig-<name>` must bring core in — otherwise it installs cleanly and
# then raises ModuleNotFoundError on first use. The navig[extra] -> plugin -> navig
# cycle is fine (verified resolving AND installing under both pip and uv; in this
# monorepo uv resolves it to the local root project via [tool.uv.sources]).
# The generation ENGINE lives in core
# (navig.media.generation_service); this plugin mounts its deck routes in-process.
dependencies = ["navig>=3.25.0", "aiohttp>=3.9.0"]

# Discovered by navig.core.plugins.load_entry_point_plugins() at gateway boot;
# register() mounts the generation deck routes via the gateway:register_routes hook
# and registers the free "generate" module. No CLI entry point — `navig generate`
# is a core built-in (`navig media` remains as its deprecated alias).
[project.entry-points."navig.plugins"]
generate = "navig_generate.plugin"

[tool.setuptools.packages.find]
include = ["navig_generate*"]

[tool.setuptools.package-data]
# Ship bundled capability skills (auto-discovered by the agent) in the wheel.
navig_generate = ["skills/**/*.md"]

[project.urls]
Homepage = "https://navig.run"
Documentation = "https://navig.run/docs"

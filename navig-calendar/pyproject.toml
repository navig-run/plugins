[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navig-calendar"
version = "0.1.2"
description = "NAVIG Calendar module — list/add/sync events (Google Calendar, CalDAV, ICS). A first-party navig plugin (free, toggleable)."
readme = "README.md"
authors = [{ name = "NAVIG Development Team", email = "opensource@navig.run" }]
keywords = ["navig", "cli", "agent", "automation", "plugin", "calendar", "events", "google-calendar", "caldav", "ics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
requires-python = ">=3.10"
license = "Apache-2.0"
# No hard deps: relies on navig-core (the calendar PROVIDERS stay in core's
# navig.agent.proactive — shared with the proactive assistant; the CLI moved out).
# Declares navig: this plugin's code imports navig.* directly, so a bare
# `pip install navig-<name>` must bring core in — otherwise it installs cleanly and
# then raises ModuleNotFoundError on first use.
dependencies = ["navig>=3.25.0"]

[project.entry-points."navig.plugins"]
calendar = "navig_calendar.plugin"

[project.entry-points."navig.commands"]
calendar = "navig_calendar.commands.calendar:calendar_app"

[tool.setuptools.packages.find]
include = ["navig_calendar*"]

[tool.setuptools.package-data]
# Ship bundled capability skills (auto-discovered by the agent) in the wheel.
navig_calendar = ["skills/**/*.md"]

[project.urls]
Homepage = "https://navig.run"
Documentation = "https://navig.run/docs"

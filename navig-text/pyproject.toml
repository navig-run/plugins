[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navig-text"
version = "0.5.1"
description = "NAVIG Text module — AI text generation (drafts/articles/captions/briefs) + `navig design` (agent HTML/CSS restyle + design tokens) for the Design Mode lens. A first-party navig plugin (free, toggleable). The TEXT facet of the shared media generation engine."
readme = "README.md"
authors = [{ name = "NAVIG Development Team", email = "opensource@navig.run" }]
keywords = ["navig", "cli", "agent", "automation", "plugin", "text", "ai", "generation", "design", "css", "html"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
requires-python = ">=3.10"
license = "Apache-2.0"
# Runs WITHOUT navig: AI goes through navig-sdk — navig's AI inside navig, the user's own
# (any provider key, an OpenAI-compatible URL, or a local Ollama) on its own. navig.* is
# reached only through guarded imports (presets, space discovery). The TEXT generation
# facet registers into navig-media-core's generator registry when it is installed (it is
# whenever navig is; `navig-text[media]` adds it standalone).
dependencies = ["navig-sdk>=2.8.0", "typer>=0.14.0", "rich>=13.7.0"]

[project.optional-dependencies]
media = ["navig-media-core>=0.2.0"]

# Its own command: `navig text` and `navig design` in one (`navig-text design …`).
[project.scripts]
navig-text = "navig_text.cli:main"

# Discovered by navig.core.plugins.load_entry_point_plugins() at gateway boot;
# register() adds the free "text" module AND wires the TEXT generation facet.
[project.entry-points."navig.plugins"]
text = "navig_text.plugin"

# `navig text` (gen / check) + `navig design` (edit). Discovered by
# navig.cli.registration._entry_point_commands() — no hardcoded map entry needed.
# `design` lives here (not a separate plugin) because it is an agent-backed
# text/markup transform sharing the same core AI client as text generation.
[project.entry-points."navig.commands"]
text = "navig_text.commands.text:text_app"
design = "navig_text.commands.design:design_app"

[tool.setuptools.packages.find]
include = ["navig_text*"]

[project.urls]
Homepage = "https://navig.run"
Documentation = "https://navig.run/docs"

[tool.navig]
# Runs on its own (`navig-text`, no navig needed) AND as `navig text` / `navig design` inside navig.
# Checked against the package by scripts/check_plugins_publishable.py.
mode = "standalone"

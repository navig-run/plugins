[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navig-contacts"
version = "0.2.0"
description = "NAVIG Contacts module — `navig contacts`: the address book and the alias-to-route table dispatch resolves against, in one store. Imports vCard and Telegram exports, merges the same person out of many records, and keeps only contacts with a phone number that validates."
readme = "README.md"
authors = [{ name = "NAVIG Development Team", email = "opensource@navig.run" }]
keywords = ["navig", "cli", "agent", "automation", "plugin", "contacts", "vcard", "address-book", "crm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
requires-python = ">=3.10"
license = "Apache-2.0"
# Runs WITHOUT navig: the store lives here (navig.store.contacts is an alias of
# navig_contacts.store) and paths/console/storage come from navig-sdk, which defers to
# navig when it is installed. Only `--space` and Telegram-export import need navig,
# and they say so. navig itself hard-depends on this package, so it is never missing there.
#
# phonenumbers is not optional here: "a contact is legit only if it has a phone
# number" is the whole model, and deciding that with a regex is what produces an
# address book full of short codes and troll numbers. Pillow/imagehash are NOT
# dependencies — avatar extraction degrades to "not available" without them.
dependencies = ["navig-sdk>=2.12.0", "phonenumbers>=8.13", "typer>=0.14.0", "rich>=13.7.0"]

[project.optional-dependencies]
# Extracting avatars embedded in vCards, and finding the same picture among
# photos whose owner is unknown.
photos = ["Pillow>=10.0", "ImageHash>=4.3"]

# Discovered by navig.cli.registration._entry_point_commands() — the CLI seam.
# This IS `navig contacts`. Core no longer registers the name — it hard-depends
# on this package instead, so the verb is always present.  A plugin entry point
# is only reachable because core's built-in map entry was removed in the same
# change; the registrar prefers built-ins and would silently ignore this.
# Its own command: the same app navig mounts as `navig contacts`.
[project.scripts]
navig-contacts = "navig_contacts.cli:main"

[project.entry-points."navig.commands"]
contacts = "navig_contacts.commands.contacts:app"
# `navig ct` was a hidden alias for `navig contacts` in core's built-in map.
# It moves with the command, or core's manifest guard finds a hidden name
# that no longer resolves.
ct = "navig_contacts.commands.contacts:app"

[tool.setuptools.packages.find]
include = ["navig_contacts*"]

[project.urls]
Homepage = "https://navig.run"
Documentation = "https://navig.run/docs"

[tool.navig]
# Runs on its own (`navig-contacts`, no navig needed) AND as `navig contacts` inside navig.
# Checked against the package by scripts/check_plugins_publishable.py.
mode = "standalone"

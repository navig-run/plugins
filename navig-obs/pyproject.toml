[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navig-obs"
version = "0.6.0"
description = "Control OBS Studio from navig — scenes, sources, streams, recording, studio mode, whole obs-websocket v5 surface — its own navig-obs command, and `navig obs` inside navig."
readme = "README.md"
authors = [{ name = "NAVIG Development Team", email = "opensource@navig.run" }]
keywords = ["navig", "cli", "agent", "automation", "plugin", "obs", "obs-websocket", "streaming", "recording"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
  "Topic :: Utilities",
]
requires-python = ">=3.10"
license = "Apache-2.0"
# Runs WITHOUT navig: the obs-websocket engine + CLI are pure stdlib/websockets/rich,
# and the only navig touches (resolve_user_path, navig.config.get) are guarded lazy
# imports. navig installs it, not the reverse.
dependencies = [
  "navig-sdk>=2.7.0",
  "typer>=0.14.0",
  "rich>=13.7.0",
  "websockets>=12.0",
]

# Its own command: the same app navig mounts as `navig obs`.
[project.scripts]
navig-obs = "navig_obs.cli:main"

# Discovered by navig.core.plugins.load_entry_point_plugins() at gateway boot;
# register() adds the free "obs" module.
[project.entry-points."navig.plugins"]
obs = "navig_obs.plugin"

# Discovered by navig.cli.registration._entry_point_commands() — the CLI seam.
[project.entry-points."navig.commands"]
obs = "navig_obs.commands.obs:obs_app"

[tool.setuptools.packages.find]
include = ["navig_obs*"]

[tool.setuptools.package-data]
# Ship bundled capability skills (auto-discovered by the agent) in the wheel.
navig_obs = ["skills/**/*.md"]

[project.urls]
Homepage = "https://navig.run"
Documentation = "https://navig.run/docs"

[tool.navig]
# Runs on its own (`navig-obs`, no navig needed) AND as `navig obs` inside navig.
# Checked against the package by scripts/check_plugins_publishable.py.
mode = "standalone"

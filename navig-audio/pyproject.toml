[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navig-audio"
version = "0.1.1"
description = "NAVIG Audio module — voice (TTS/STT/wake-word/pipeline) + AI audio generation (music/SFX/TTS). A first-party navig plugin (free, toggleable). Extracted from core navig.voice."
readme = "README.md"
authors = [{ name = "NAVIG Development Team", email = "opensource@navig.run" }]
keywords = ["navig", "cli", "agent", "automation", "plugin", "audio", "tts", "stt", "voice", "transcription"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
requires-python = ">=3.10"
license = "Apache-2.0"
# Declares navig: this plugin's code imports navig.* directly, so a bare
# `pip install navig-<name>` must bring core in — otherwise it installs cleanly and
# then raises ModuleNotFoundError on first use. The navig[extra] -> plugin -> navig
# cycle is fine (verified resolving AND installing under both pip and uv; in this
# monorepo uv resolves it to the local root project via [tool.uv.sources]).
# The voice ENGINES (edge-tts / STT)
# live here; core keeps thin `navig.voice.*` shims that re-export navig_audio.voice.
# `httpx` powers AI audio generation (core's ElevenLabs client in navig.tools).
dependencies = ["navig>=3.25.0", "edge-tts>=6.1.9", "openai>=1.0.0", "faster-whisper>=1.0.0", "httpx>=0.24.0"]

# Discovered by navig.core.plugins.load_entry_point_plugins() at gateway boot;
# register() adds the free "audio" module AND wires the AUDIO generation facet.
[project.entry-points."navig.plugins"]
audio = "navig_audio.plugin"

# `navig audio` (gen / check) — AI audio generation. Discovered by
# navig.cli.registration._entry_point_commands() (no hardcoded map entry needed).
# The `navig voice` CLI stays in core (it shims to navig_audio.voice).
[project.entry-points."navig.commands"]
audio = "navig_audio.commands.audio:audio_app"

[tool.setuptools.packages.find]
include = ["navig_audio*"]

[tool.setuptools.package-data]
# Ship bundled capability skills (auto-discovered by the agent) in the wheel.
navig_audio = ["skills/**/*.md"]

[project.urls]
Homepage = "https://navig.run"
Documentation = "https://navig.run/docs"
